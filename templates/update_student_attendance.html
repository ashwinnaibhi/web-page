<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Attendance - Staff</title>
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #f3f7fc;
  margin: 0;
  text-align: center;
}
header {
  background-color: #004aad;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: center; /* center title */
  align-items: center;
  position: relative; /* to position button in corner */
}
header h2 {
  margin: 0;
  font-size: 1.5em;
  text-align: center;
  flex: 1;
}
header button {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  padding: 6px 12px;
  font-size: 0.9em;
  background: #ffffff;
  color: #004aad;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
header button:hover {
  background: #ffb100;
  color: black;
}
.container {
  background: white;
  width: 90%;
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}
select {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 80%;
      outline: none;
      transition: 0.3s;
    }
  .back-button {
    position: absolute;
    right: 20px;
    top: 12px;
    background-color: white;
    color: #004aad;
    border: none;
    padding: 8px 14px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}
.back-button:hover {
    background-color: #e6ecff;
}
.flash-success { background: #d1ffd1; color: green; padding: 10px; border-radius: 6px; }
.flash-error { background: #ffd1d1; color: red; padding: 10px; border-radius: 6px; }
#attendance-form { display: none; }
.status-updated { background: #c8f7c5; color: green; font-weight: bold; padding: 6px; border-radius: 5px; }
</style>
</head>
<body>

<header>
  <h2>Staff Attendance Dashboard</h2>
  <button class="back-button" onclick="window.location.href='/staff'">⟵ Dashboard</button>
</header>

<div class="container">
  <h3>Update Attendance for {{ subject }}</h3>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- Step 1: Select Date -->
  <label><strong>Select Date:</strong></label><br>
  <select id="date-select">
    <option value="">-- Choose Date --</option>
    {% for d in unique_dates %}
      <option value="{{ d }}">{{ d }}</option>
    {% endfor %}
  </select>

  <!-- Step 2: Select Student -->
  <div id="student-select-container" style="display:none;">
    <label><strong>Select Student:</strong></label><br>
    <select id="student-select">
      <option value="">-- Choose Student --</option>
    </select>
  </div>

  <!-- Step 3: Update -->
  <form id="attendance-form" method="POST">
    <label><strong>Status:</strong></label><br>
    <select id="status" name="status">
      <option value="Present">Present</option>
      <option value="Absent">Absent</option>
      <option value="No Class">No Class</option>
    </select><br>
    <button type="submit">Update Attendance</button>
  </form>

  <p id="update-msg"></p>
</div>

<script>
const records = {{ records|tojson }};
const dateSelect = document.getElementById('date-select');
const studentContainer = document.getElementById('student-select-container');
const studentSelect = document.getElementById('student-select');
const attendanceForm = document.getElementById('attendance-form');
const updateMsg = document.getElementById('update-msg');

let selectedDate = '';
let selectedStudent = '';

dateSelect.addEventListener('change', () => {
  selectedDate = dateSelect.value;
  studentSelect.innerHTML = '<option value="">-- Choose Student --</option>';

  if (selectedDate) {
    const students = records
      .filter(r => r.Date === selectedDate)
      .map(r => r.StudentID);
    const uniqueStudents = [...new Set(students)];
    uniqueStudents.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      studentSelect.appendChild(opt);
    });
    studentContainer.style.display = 'block';
    attendanceForm.style.display = 'none';
  } else {
    studentContainer.style.display = 'none';
    attendanceForm.style.display = 'none';
  }
});

studentSelect.addEventListener('change', () => {
  selectedStudent = studentSelect.value;
  attendanceForm.style.display = selectedStudent ? 'block' : 'none';
});

attendanceForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const formData = new FormData(attendanceForm);
  formData.append('date', selectedDate);
  formData.append('student', selectedStudent);

  fetch('/staff/attendance', {
    method: 'POST',
    body: formData,
    headers: { 'X-Requested-With': 'XMLHttpRequest' }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      updateMsg.textContent = '✅ Attendance updated successfully!';
      updateMsg.className = 'status-updated';
    } else {
      updateMsg.textContent = '❌ ' + data.error;
      updateMsg.className = 'flash-error';
    }
  })
  .catch(err => {
    updateMsg.textContent = '⚠️ Request failed: ' + err;
    updateMsg.className = 'flash-error';
  });
});
</script>

</body>
</html>
