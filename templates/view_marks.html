<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marks</title>
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #dce9ff, #f3f7fc);
  margin: 0;
}

/* Header */
.header {
  background: #004aad;
  color: white;
  padding: 15px 20px;
  font-size: 20px;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Dashboard Button */
.back-button {
  background: #ffb100;
  color: #000;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: 0.3s;
}
.back-button:hover {
  background: #fff;
  color: #004aad;
}

.container {
  width: 90%;
  max-width: 800px;
  margin: 30px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* Centered Heading with background */
h2 {
  text-align: center;
  background: #004aad;
  color: #fff;
  padding: 10px;
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
table, th, td {
  border: 1px solid #ccc;
}

/* TH background color */
th {
  background: #004aad;
  color: white;
  padding: 10px;
}
td {
  padding: 10px;
  text-align: left;
}
</style>
</head>
<body>

<!-- Header Section -->
<div class="header">
  <div>JSS Academy of Technical Education, Bengaluru</div>

  <a href="{% if role == 'parent' %}{{ url_for('parent_dashboard') }}{% else %}{{ url_for('student_dashboard') }}{% endif %}?student_usn={{ usn }}">
      <button class="back-button">← Dashboard</button>
  </a>
</div>

<div class="container">

  <h2>Marks</h2>

  <table>
    <tr>
      <th>USN</th>
      <th>Name</th>
      <th>Subject</th>
      <th>Marks</th>
      <th>Updated By</th>
      <th>Timestamp</th>
    </tr>

    {% for m in marks %}
    <tr>
      <td>{{ m['Student USN'] }}</td>
      <td>{{ m['Student Name'] }}</td>
      <td>{{ m['Subject'] }}</td>
      <td>{{ m['Marks'] }}</td>
      <td>{{ m['Updated By'] }}</td>
      <td>{{ m['Timestamp'] }}</td>
    </tr>
    {% endfor %}
  </table>
</div>

</body>
</html>
